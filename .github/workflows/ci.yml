# Verification only. This workflow never pushes an image - publishing lives in
# docker.yml and is driven exclusively by `v*` tags. Keep it that way: listening
# on both a branch and its tag double-runs every build.
#
# Small on purpose. There is no test suite yet, so this is the two things that
# can be checked without one: the frontend type-checks, and the backend can be
# imported. Both have caught real breakage already - a toast tone that was not
# in the union, and a router that would not load.
name: CI

on:
  push:
    branches: [main]
    # Tags are docker.yml's job. Without this, tagging a commit on main would
    # run both workflows over the same tree.
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - tsc and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      # `npm run lint` is `tsc --noEmit`.
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Backend - import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Import the app
        # DATA_DIR into the workspace: importing builds the settings object,
        # which creates the data directory, and the default `/data` is not
        # writable on a runner.
        env:
          DATA_DIR: ./ci-data
        run: |
          python -c "
          import sys; sys.path.insert(0, 'backend')
          from app.main import app
          routes = [r.path for r in app.routes if getattr(r, 'path', '').startswith('/api')]
          print(f'{len(routes)} API routes registered')
          assert '/api/health' in routes
          "
